<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoiczE5ODgxMjA0IiwiYSI6ImNtdTZiNm8yMDA3OGgyd29nYnRicDI0aHIifQ.2sRRvPv8OaEvu5DAIJDlMw';
  
  const AIRPORT_DB = {
    "EVA": [25.040060, 121.298676], "BR": [25.040060, 121.298676],
    "TPE": [25.0797, 121.2342], "RCTP": [25.0797, 121.2342],
    "TSA": [25.0697, 121.5525], "RCSS": [25.0697, 121.5525],
    "RMQ": [24.2644, 120.6208], "RCMQ": [24.2644, 120.6208],
    "KHH": [22.5711, 120.3500], "RCKH": [22.5711, 120.3500],
    "TNN": [22.9504, 120.2058], "RCNN": [22.9504, 120.2058],
    "HND": [35.5494, 139.7798], "RJTT": [35.5494, 139.7798],
    "NRT": [35.7647, 140.3863], "RJAA": [35.7647, 140.3863],
    "KIX": [34.4347, 135.2442], "RJBB": [34.4347, 135.2442],
    "FUK": [33.5859, 130.4507], "RJFF": [33.5859, 130.4507],
    "OKA": [26.1958, 127.6458], "ROAH": [26.1958, 127.6458],
    "HKG": [22.3080, 113.9185], "VHHH": [22.3080, 113.9185],
    "ICN": [37.4602, 126.4407], "RKSI": [37.4602, 126.4407],
    "BKK": [13.6900, 100.7501], "VTBS": [13.6900, 100.7501],
    "SIN": [1.3644, 103.9915],  "WSSS": [1.3644, 103.9915]
  };

  let centerLat = parseFloat(localStorage.getItem('radar_lat')) || 25.040060;
  let centerLon = parseFloat(localStorage.getItem('radar_lon')) || 121.298676;
  let radarRangeNm = parseInt(localStorage.getItem('radar_range')) || 35;
  let currentZoom = 9.4;

  let selectedCallsign = null;
  let planesData = [];
  let markers = {};
  let centerMarker = null;

  const PLANE_SVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2300ff66"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>`;
  const PLANE_SVG_FOCUS = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffd700"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>`;

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [centerLon, centerLat],
    zoom: currentZoom,
    attributionControl: false
  });

  function updateRadarRings() {
    const centerPoint = turf.point([centerLon, centerLat]);
    const circle10 = turf.circle(centerPoint, 10 * 1.852, { steps: 128, units: 'kilometers' });
    const circle20 = turf.circle(centerPoint, 20 * 1.852, { steps: 128, units: 'kilometers' });
    const circle30 = turf.circle(centerPoint, 30 * 1.852, { steps: 128, units: 'kilometers' });

    const geojsonData = {
      type: "FeatureCollection",
      features: [circle10, circle20, circle30]
    };

    if (map.getSource('radar-rings')) {
      map.getSource('radar-rings').setData(geojsonData);
    } else {
      map.addSource('radar-rings', { type: 'geojson', data: geojsonData });
      map.addLayer({
        id: 'radar-rings-line',
        type: 'line',
        source: 'radar-rings',
        paint: {
          'line-color': '#00ff66',
          'line-width': 1.5,
          'line-opacity': 0.65
        }
      });
    }

    if (!centerMarker) {
      const el = document.createElement('div');
      el.style.width = '8px';
      el.style.height = '8px';
      el.style.backgroundColor = 'red';
      el.style.borderRadius = '50%';
      el.style.boxShadow = '0 0 8px red';
      centerMarker = new mapboxgl.Marker({ element: el })
        .setLngLat([centerLon, centerLat])
        .addTo(map);
    } else {
      centerMarker.setLngLat([centerLon, centerLat]);
    }
  }

  map.on('load', () => {
    updateRadarRings();
    fetchFlightsDualSource();
  });

  function updateClock() {
    const now = new Date();
    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const w = days[now.getDay()];
    
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');

    document.getElementById('clock-date').innerText = `${y}-${m}-${d}  ${w}`;
    document.getElementById('clock-time').innerText = `${hh}:${mm}:${ss}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  let isFetching = false;

  // 雙通道抓取：OpenSky (免代理直通) + Worker 備援
  async function fetchFlightsDualSource() {
    if (isFetching) return;
    isFetching = true;

    const countElem = document.getElementById('val-count');
    const dLat = (radarRangeNm / 60.0);
    const dLon = (radarRangeNm / (60.0 * Math.cos(centerLat * Math.PI / 180)));
    
    const lamin = (centerLat - dLat).toFixed(4);
    const lamax = (centerLat + dLat).toFixed(4);
    const lomin = (centerLon - dLon).toFixed(4);
    const lomax = (centerLon + dLon).toFixed(4);

    let parsed = [];

    // 通道 1：OpenSky Network 直連
    try {
      const controller = new AbortController();
      const tid = setTimeout(() => controller.abort(), 4000);
      const res = await fetch(`https://opensky-network.org/api/states/all?lamin=${lamin}&lomin=${lomin}&lamax=${lamax}&lomax=${lomax}`, {
        signal: controller.signal
      });
      clearTimeout(tid);

      if (res.ok) {
        const json = await res.json();
        if (json && json.states) {
          parsed = json.states.map(s => {
            const cs = (s[1] || "N/A").trim();
            const lon = s[5];
            const lat = s[6];
            const alt = s[7] ? Math.round(s[7] * 3.28084) : 0;
            const spd = s[9] ? Math.round(s[9] * 1.94384) : 0;
            const trk = s[10] || 0;
            const dist = calcDistance(centerLat, centerLon, lat, lon);
            return {
              callsign: cs,
              type: "COMM",
              reg: (s[0] || "").toUpperCase(),
              lat: lat,
              lon: lon,
              alt: alt,
              speed: spd,
              track: trk,
              dist: dist
            };
          });
        }
      }
    } catch (e) {
      console.warn("OpenSky failed, switching to backup...", e);
    }

    // 通道 2 備援：若 OpenSky 沒回應，走快速公共代理拉取 airplanes.live
    if (parsed.length === 0) {
      try {
        const target = `https://api.airplanes.live/v2/point/${centerLat.toFixed(4)}/${centerLon.toFixed(4)}/${radarRangeNm}`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`;
        
        const controller2 = new AbortController();
        const tid2 = setTimeout(() => controller2.abort(), 4000);
        const res2 = await fetch(proxyUrl, { signal: controller2.signal });
        clearTimeout(tid2);

        if (res2.ok) {
          const json2 = await res2.json();
          if (json2 && json2.ac) {
            parsed = json2.ac.filter(p => p.lat && p.lon).map(p => {
              const cs = (p.flight || "N/A").trim();
              const dist = calcDistance(centerLat, centerLon, p.lat, p.lon);
              return {
                callsign: cs,
                type: p.t || "UNK",
                reg: p.r || "---",
                lat: p.lat,
                lon: p.lon,
                alt: p.alt_baro || 0,
                speed: p.gs || 0,
                track: p.track || 0,
                dist: dist
              };
            });
          }
        }
      } catch (err2) {
        console.warn("AllOrigins backup also failed:", err2);
      }
    }

    if (parsed.length > 0) {
      planesData = parsed.sort((a, b) => a.dist - b.dist);
      renderPlanesOnMap();
      updateSidebar();
    } else {
      // 保持前一次資料，若一直為 0 則顯示狀態
      if (planesData.length === 0) {
        countElem.innerText = "Airbornes: 0 (Connecting...)";
      }
    }

    isFetching = false;
  }

  function calcDistance(lat1, lon1, lat2, lon2) {
    const R = 3440.065;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function renderPlanesOnMap() {
    const currentKeys = new Set();

    planesData.forEach(p => {
      currentKeys.add(p.callsign);
      const isFocused = (p.callsign === selectedCallsign) || (!selectedCallsign && planesData[0]?.callsign === p.callsign);

      if (!markers[p.callsign]) {
        const el = document.createElement('div');
        el.className = 'plane-marker';
        
        const img = document.createElement('img');
        img.className = 'plane-icon';
        img.src = isFocused ? PLANE_SVG_FOCUS : PLANE_SVG;
        img.style.transform = `rotate(${p.track}deg)`;

        const lbl = document.createElement('div');
        lbl.className = 'plane-label';
        lbl.innerText = p.callsign;

        el.appendChild(img);
        el.appendChild(lbl);

        el.onclick = (e) => {
          e.stopPropagation();
          selectedCallsign = p.callsign;
          renderPlanesOnMap();
          updateSidebar();
        };

        markers[p.callsign] = new mapboxgl.Marker({ element: el })
          .setLngLat([p.lon, p.lat])
          .addTo(map);
      } else {
        markers[p.callsign].setLngLat([p.lon, p.lat]);
        const el = markers[p.callsign].getElement();
        const icon = el.querySelector('.plane-icon');
        icon.src = isFocused ? PLANE_SVG_FOCUS : PLANE_SVG;
        icon.style.transform = `rotate(${p.track}deg)`;
        el.className = `plane-marker ${isFocused ? 'focused' : ''}`;
      }
    });

    Object.keys(markers).forEach(cs => {
      if (!currentKeys.has(cs)) {
        markers[cs].remove();
        delete markers[cs];
      }
    });
  }

  function getInstantRouteInfo(callsign, alt, dist) {
    if (!callsign || callsign === "N/A") {
      return { airline: "---", dep: "---", arr: "---", atd: "---", eta: "---", eet: "---", icao: "" };
    }

    let airline = "Commercial";
    let icao = "";
    const cs = callsign.toUpperCase();

    if (cs.startsWith("EVA") || cs.startsWith("BR")) { airline = "EVA Air (長榮航空)"; icao = "EVA"; }
    else if (cs.startsWith("CAL") || cs.startsWith("CI")) { airline = "China Airlines (中華航空)"; icao = "CAL"; }
    else if (cs.startsWith("SJX") || cs.startsWith("JX")) { airline = "STARLUX (星宇航空)"; icao = "SJX"; }
    else if (cs.startsWith("TTW") || cs.startsWith("IT")) { airline = "Tigerair Taiwan (台灣虎航)"; icao = "TTW"; }
    else if (cs.startsWith("MDA") || cs.startsWith("AE")) { airline = "Mandarin Airlines (華信航空)"; icao = "MDA"; }
    else if (cs.startsWith("UIA") || cs.startsWith("B7")) { airline = "UNI Air (立榮航空)"; icao = "UIA"; }
    else if (cs.startsWith("CPA") || cs.startsWith("CX")) { airline = "Cathay Pacific (國泰航空)"; icao = "CPA"; }
    else if (cs.startsWith("ANA") || cs.startsWith("NH")) { airline = "All Nippon Airways (全日空)"; icao = "ANA"; }
    else if (cs.startsWith("JAL") || cs.startsWith("JL")) { airline = "Japan Airlines (日本航空)"; icao = "JAL"; }
    else if (cs.startsWith("KAL") || cs.startsWith("KE")) { airline = "Korean Air (大韓航空)"; icao = "KAL"; }
    else if (cs.startsWith("AAR") || cs.startsWith("OZ")) { airline = "Asiana Airlines (韓亞航空)"; icao = "AAR"; }
    else if (cs.startsWith("SIA") || cs.startsWith("SQ")) { airline = "Singapore Airlines (新航)"; icao = "SIA"; }
    else if (cs.startsWith("APJ") || cs.startsWith("MM")) { airline = "Peach Aviation (樂桃航空)"; icao = "APJ"; }
    else if (cs.startsWith("FDX") || cs.startsWith("FX")) { airline = "FedEx Express (聯邦快遞)"; icao = "FDX"; }
    else if (cs.startsWith("UPS") || cs.startsWith("5X")) { airline = "UPS Airlines (優比速)"; icao = "UPS"; }

    let dep = "---", arr = "---";
    const now = Math.floor(Date.now() / 1000);

    if (alt < 9000) {
      dep = "Origin";
      arr = (centerLat > 25.06 && centerLon > 121.45) ? "TSA" : "TPE";
      const etaMins = Math.max(3, Math.round(dist * 0.45));
      const atd = new Date((now - 7200) * 1000).toTimeString().substring(0, 5);
      const eta = new Date((now + etaMins * 60) * 1000).toTimeString().substring(0, 5);
      return { airline, dep, arr, atd, eta, eet: `02h ${etaMins}m`, icao };
    } else {
      dep = (centerLat > 25.06 && centerLon > 121.45) ? "TSA" : "TPE";
      arr = "En Route";
      const atd = new Date((now - 1200) * 1000).toTimeString().substring(0, 5);
      const eta = new Date((now + 6800) * 1000).toTimeString().substring(0, 5);
      return { airline, dep, arr, atd, eta, eet: "02h 10m", icao };
    }
  }

  function updateSidebar() {
    document.getElementById('val-count').innerText = `Airbornes: ${planesData.length}`;

    let target = planesData.find(p => p.callsign === selectedCallsign) || planesData[0];
    if (target) {
      document.getElementById('card-status').innerText = (target.callsign === selectedCallsign) ? "SELECTED TARGET" : "NEAREST TARGET";
      document.getElementById('card-status').style.color = (target.callsign === selectedCallsign) ? "#00e5ff" : "#ffd700";
      
      document.getElementById('card-callsign').innerText = target.callsign;
      document.getElementById('val-type').innerText = target.type;
      document.getElementById('val-reg').innerText = target.reg;
      document.getElementById('val-alt').innerText = target.alt;
      document.getElementById('val-spd').innerText = target.speed;
      document.getElementById('val-dist').innerText = target.dist.toFixed(1);
      document.getElementById('val-trk').innerText = Math.round(target.track);

      const rinfo = getInstantRouteInfo(target.callsign, target.alt, target.dist);
      document.getElementById('card-airline').innerText = rinfo.airline;
      document.getElementById('val-dep').innerText = rinfo.dep;
      document.getElementById('val-arr').innerText = rinfo.arr;
      document.getElementById('val-atd').innerText = rinfo.atd;
      document.getElementById('val-eta').innerText = rinfo.eta;
      document.getElementById('val-eet').innerText = rinfo.eet;

      const logo = document.getElementById('card-logo');
      if (rinfo.icao) {
        logo.src = `https://images.flightaware.com/airline_logos/80px/${rinfo.icao}.png`;
        logo.style.display = 'block';
        logo.onerror = function() { this.style.display = 'none'; };
      } else {
        logo.style.display = 'none';
      }
    } else {
      document.getElementById('card-status').innerText = "TARGET INFO";
      document.getElementById('card-status').style.color = "#888";
      document.getElementById('card-callsign').innerText = "NO TARGET";
      document.getElementById('card-airline').innerText = "Airline: ---";
      document.getElementById('val-type').innerText = "---";
      document.getElementById('val-reg').innerText = "---";
      document.getElementById('val-alt').innerText = "---";
      document.getElementById('val-spd').innerText = "---";
      document.getElementById('val-dist').innerText = "---";
      document.getElementById('val-trk').innerText = "---";
      document.getElementById('val-dep').innerText = "---";
      document.getElementById('val-arr').innerText = "---";
      document.getElementById('val-atd').innerText = "---";
      document.getElementById('val-eta').innerText = "---";
      document.getElementById('val-eet').innerText = "---";
      document.getElementById('card-logo').style.display = 'none';
    }
  }

  function resetToEVA() {
    centerLat = 25.040060;
    centerLon = 121.298676;
    localStorage.setItem('radar_lat', centerLat);
    localStorage.setItem('radar_lon', centerLon);
    map.flyTo({ center: [centerLon, centerLat], zoom: currentZoom });
    updateRadarRings();
    fetchFlightsDualSource();
  }

  function relocateToGPS() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        centerLat = pos.coords.latitude;
        centerLon = pos.coords.longitude;
        localStorage.setItem('radar_lat', centerLat);
        localStorage.setItem('radar_lon', centerLon);
        map.flyTo({ center: [centerLon, centerLat], zoom: currentZoom });
        updateRadarRings();
        fetchFlightsDualSource();
      });
    }
  }

  async function searchAirportCode() {
    const input = document.getElementById('cfg-airport-code').value.trim().toUpperCase();
    const status = document.getElementById('search-status');
    if (!input) return;

    status.innerText = "Searching coordinates...";

    if (AIRPORT_DB[input]) {
      const [lat, lon] = AIRPORT_DB[input];
      document.getElementById('cfg-lat').value = lat.toFixed(4);
      document.getElementById('cfg-lon').value = lon.toFixed(4);
      status.innerText = `✔ Found: ${input}`;
      saveConfig();
      return;
    }

    try {
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(input)}&count=1&language=en&format=json`);
      if (res.ok) {
        const json = await res.json();
        if (json.results && json.results.length > 0) {
          const lat = json.results[0].latitude;
          const lon = json.results[0].longitude;
          document.getElementById('cfg-lat').value = lat.toFixed(4);
          document.getElementById('cfg-lon').value = lon.toFixed(4);
          status.innerText = `✔ Found: ${json.results[0].name}`;
          saveConfig();
          return;
        }
      }
    } catch(e) {}

    status.innerText = "❌ Airport code not found. Please enter Lat/Lon manually.";
  }

  function openConfigModal() {
    document.getElementById('cfg-lat').value = centerLat.toFixed(4);
    document.getElementById('cfg-lon').value = centerLon.toFixed(4);
    document.getElementById('cfg-range').value = radarRangeNm;
    document.getElementById('search-status').innerText = "";
    document.getElementById('config-modal').style.display = 'flex';
  }

  function closeConfigModal() {
    document.getElementById('config-modal').style.display = 'none';
  }

  function saveConfig() {
    const lat = parseFloat(document.getElementById('cfg-lat').value);
    const lon = parseFloat(document.getElementById('cfg-lon').value);
    const range = parseInt(document.getElementById('cfg-range').value) || 35;

    if (!isNaN(lat) && !isNaN(lon)) {
      centerLat = lat;
      centerLon = lon;
      radarRangeNm = range;

      localStorage.setItem('radar_lat', centerLat);
      localStorage.setItem('radar_lon', centerLon);
      localStorage.setItem('radar_range', radarRangeNm);

      closeConfigModal();
      map.flyTo({ center: [centerLon, centerLat], zoom: currentZoom });
      updateRadarRings();
      fetchFlightsDualSource();
    }
  }

  map.on('click', () => {
    selectedCallsign = null;
    renderPlanesOnMap();
    updateSidebar();
  });

  // 每 5 秒進行一次穩定抓取
  setInterval(fetchFlightsDualSource, 5000);
</script>
